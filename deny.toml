# cargo-deny: what may enter the dependency graph (pillar 3's supply-chain
# half). test:deny checks licenses, bans and sources, which need no network;
# `cargo deny check advisories` fetches the RustSec database and runs as
# qa:advisories.

[graph]
all-features = true

[licenses]
# Every license a dependency may carry. A new one is a reviewed change here.
allow = [
  # The workspace's own crates: [licenses.private] below only covers crates
  # that are never published, and these may be.
  "CC-BY-NC-SA-4.0",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
# Two versions of one crate double its compile time and binary size; warn so
# it is seen, and deny wildcard requirements outright.
multiple-versions = "warn"
wildcards = "deny"
# A `path` dependency on a workspace member has no version to pin.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
